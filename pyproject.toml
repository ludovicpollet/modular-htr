[project]
name = "modular-htr"
version = "0.3.0"
authors = [
  {name = "Ludovic Pollet", email = "ludovic.pollet@protonmail.com"},
]
description = "Simple CLI for HTR with a modular network architecture."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.5.0",
    "flashlight-text>=0.0.7",
    "kenlm>=0.3.0",
    "kornia>=0.8.2",
    "lxml>=6.0.2",
    "numpy>=2.4.2",
    "pillow>=12.1.0",
    "tabulate>=0.9.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "tyro>=1.0.6",
]

[project.scripts]
modular-htr = "modular_htr.cli:main"

[project.optional-dependencies]
pretrained = ["timm>=1.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"
